# ===== mihomo lite configuration =====

mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
ipv6: true
mode: Rule
allow-lan: true
disable-keep-alive: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: off

external-controller: 0.0.0.0:7788
secret: "CHANGE_ME_AT_INSTALL"
external-ui: WebUI/zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-controller-cors:
  allow-origins: []
  allow-private-network: false

# Geo database source = plugin station (first copy bundled in the install package; refresh via plugin Reset)
geox-url:
  geoip: "https://www.paboe.top:48444/fe3659d9e17298bcfa2c18d0bd9478f1/18608c68/lyobbztc/kano_mihomo(增强版)/geoip.metadb"
  geosite: "https://www.paboe.top:48444/fe3659d9e17298bcfa2c18d0bd9478f1/18608c68/lyobbztc/kano_mihomo(增强版)/geosite.dat"
  mmdb: "https://www.paboe.top:48444/fe3659d9e17298bcfa2c18d0bd9478f1/18608c68/lyobbztc/kano_mihomo(增强版)/geoip.metadb"

profile:
  store-selected: true

proxy-providers:
  # Local node file: written by the plugin Import-Nodes button; no subscription needed
  我的节点:
    type: file
    path: ./proxy_providers/我的节点.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# Interface module (same as full template; core of hotspot-device proxying)
tun:
  enable: true
  device: Meta
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: redir-host
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

# Sniffer: probe real domain from TLS/HTTP before routing (prevents IP-traffic bypass)
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]

proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - DIRECT
    use:
      - 我的节点

  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - 我的节点

rule-anchor:
  IPCIDR: &IPCIDR
    {type: http, behavior: ipcidr, format: mrs, interval: 86400}
  Domain: &Domain
    {type: http, behavior: domain, format: mrs, interval: 86400}

rule-providers:
  CN_域:
    <<: *Domain
    path: ./rules/CN_域.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"
  CN_IP:
    <<: *IPCIDR
    path: ./rules/CN_IP.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"
  Private_域:
    <<: *Domain
    path: ./rules/LAN.mrs
    url: "https://cdn.jsdelivr.net/gh/GitMetaio/rule@master/rule/Clash/Lan/Lan_OCD_Domain.mrs"

rules:
  - RULE-SET,Private_域,DIRECT
  - RULE-SET,CN_域,DIRECT
  - RULE-SET,CN_IP,DIRECT
  - MATCH,节点选择
